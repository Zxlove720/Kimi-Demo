spring:
  application:
    name: oncall-assistant
  ai:
    openai:
      # 阿里云百炼 Chat API (OpenAI-compatible)
      api-key: sk-420bbfeb6f954096819f14fce5b440af
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          model: qwen-plus
          temperature: 0.3

# 阿里云百炼 Embedding API
dashscope:
  api-key: sk-420bbfeb6f954096819f14fce5b440af
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  embedding-model: text-embedding-v3

server:
  port: 8081

# 初始化时自动加载 data/ 目录下的 SOP 文档
oncall:
  data-path: data
