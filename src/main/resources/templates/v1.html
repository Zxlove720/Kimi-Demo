<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Phase 1 - 关键词搜索</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; color: #1a5276; }
        .nav { text-align: center; margin-bottom: 20px; }
        .nav a { margin: 0 10px; color: #2980b9; text-decoration: none; }
        .nav a:hover { text-decoration: underline; }
        .search-box { display: flex; gap: 10px; margin-bottom: 30px; }
        .search-box input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .search-box button { padding: 12px 24px; background: #2980b9; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .search-box button:hover { background: #1a5276; }
        .result { background: white; padding: 20px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .result h3 { color: #2980b9; margin-bottom: 8px; }
        .result .meta { font-size: 13px; color: #888; margin-bottom: 10px; }
        .result .snippet { color: #555; line-height: 1.6; }
        .empty { text-align: center; color: #888; padding: 40px; }
        .loading { text-align: center; color: #2980b9; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Phase 1：关键词搜索引擎</h1>
        <div class="nav">
            <a href="/v1">关键词搜索</a> |
            <a href="/v2">语义搜索</a> |
            <a href="/v3">On-Call 助手</a>
        </div>
        <div class="search-box">
            <input type="text" id="query" placeholder="输入关键词，如 OOM、故障、CDN..." onkeypress="if(event.key==='Enter') search()">
            <button onclick="search()">搜索</button>
        </div>
        <div id="results"></div>
    </div>

    <script>
        async function search() {
            const q = document.getElementById('query').value;
            const container = document.getElementById('results');
            container.innerHTML = '<div class="loading">搜索中...</div>';
            
            try {
                const res = await fetch('/v1/search?q=' + encodeURIComponent(q));
                const data = await res.json();
                render(data);
            } catch (e) {
                container.innerHTML = '<div class="empty">请求失败: ' + e.message + '</div>';
            }
        }

        function render(data) {
            const container = document.getElementById('results');
            if (!data.results || data.results.length === 0) {
                container.innerHTML = '<div class="empty">未找到相关文档</div>';
                return;
            }
            container.innerHTML = data.results.map(r => `
                <div class="result">
                    <h3>${escapeHtml(r.title)}</h3>
                    <div class="meta">ID: ${r.id} | 匹配度: ${r.score.toFixed(2)}</div>
                    <div class="snippet">${escapeHtml(r.snippet)}</div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
